# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- prod

pool:
  name: 'Default'

steps:
- task: Docker@2
  inputs:
    containerRegistry: 'docker-hub'
    command: 'login'

- task: Docker@2
  inputs:
    containerRegistry: 'docker-hub'
    command: 'build'
    Dockerfile: '**/Dockerfile'

- task: Docker@2
  inputs:
    containerRegistry: 'docker-hub'
    command: 'push'